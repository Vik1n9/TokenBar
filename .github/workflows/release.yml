name: release

# Publishing is driven by the tag: push `vX.Y.Z` and this builds the same
# artifacts CI already builds, then attaches them to a GitHub release of that
# name. Nothing is released from a branch, so what users download always
# corresponds to a tagged commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release and upload its assets

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the bundle version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$tag" != "$plist" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist." >&2
            echo "The in-app update check compares against this release's tag, so they have to agree." >&2
            exit 1
          fi

      - name: Build and self-check
        run: |
          swift build -c release --arch arm64 --arch x86_64
          "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/TokenBar" --self-check

      - name: Package the app
        run: ./scripts/package-release.sh

      - name: Assemble release notes
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            cp "$notes" dist/notes.md
          else
            cp docs/releases/template.md dist/notes.md
          fi
          # Checksums are only known once the artifacts exist, so they are
          # appended here rather than kept in the notes file.
          {
            echo
            echo '## Checksums'
            echo '```'
            shasum -a 256 dist/*.dmg dist/*.zip | sed 's|dist/||'
            echo '```'
          } >> dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.zip \
            --title "TokenBar $GITHUB_REF_NAME" \
            --notes-file dist/notes.md
